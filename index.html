<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ShiftApp() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [shifts, setShifts] = useState(() => {
        const saved = localStorage.getItem('shift_data');
        return saved ? JSON.parse(saved) : {};
      });
      const [selectedDate, setSelectedDate] = useState(null);
      const [shiftType, setShiftType] = useState('早番');
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('18:00');
      const [memo, setMemo] = useState('');

      useEffect(() => {
        localStorage.setItem('shift_data', JSON.stringify(shifts));
      }, [shifts]);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();

      const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const handleSaveShift = () => {
        if (!selectedDate) return;
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(selectedDate).padStart(2, '0')}`;
        setShifts(prev => ({
          ...prev,
          [key]: { type: shiftType, start: startTime, end: endTime, memo }
        }));
        setSelectedDate(null);
        setMemo('');
      };

      const handleDeleteShift = (key) => {
        setShifts(prev => {
          const updated = { ...prev };
          delete updated[key];
          return updated;
        });
      };

      const renderCalendar = () => {
        const cells = [];
        for (let i = 0; i < firstDay; i++) {
          cells.push(<div key={`empty-${i}`} className="h-20 bg-slate-100/50 border border-slate-200"></div>);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const shift = shifts[dateKey];

          cells.push(
            <div 
              key={day} 
              onClick={() => {
                setSelectedDate(day);
                if (shift) {
                  setShiftType(shift.type);
                  setStartTime(shift.start);
                  setEndTime(shift.end);
                  setMemo(shift.memo || '');
                }
              }}
              className="h-20 border border-slate-200 p-1 bg-white flex flex-col justify-between cursor-pointer active:bg-blue-50 transition"
            >
              <span className="font-bold text-xs text-slate-600">{day}</span>
              {shift && (
                <div className="bg-blue-500 text-white p-1 rounded text-[10px] leading-tight shadow-sm">
                  <div className="font-bold">{shift.type}</div>
                  <div>{shift.start}-{shift.end}</div>
                </div>
              )}
            </div>
          );
        }

        return cells;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-md flex flex-col pb-10">
          <header className="bg-slate-800 text-white p-4 flex justify-between items-center sticky top-0 z-10">
            <button onClick={handlePrevMonth} className="px-3 py-1 bg-slate-700 rounded text-sm hover:bg-slate-600">前月</button>
            <h1 className="text-lg font-bold">{year}年 {month + 1}月</h1>
            <button onClick={handleNextMonth} className="px-3 py-1 bg-slate-700 rounded text-sm hover:bg-slate-600">次月</button>
          </header>

          <div className="grid grid-cols-7 bg-slate-100 text-center font-bold text-xs text-slate-500 border-b border-slate-200">
            <div className="py-2 text-red-500">日</div>
            <div className="py-2">月</div>
            <div className="py-2">火</div>
            <div className="py-2">水</div>
            <div className="py-2">木</div>
            <div className="py-2">金</div>
            <div className="py-2 text-blue-500">土</div>
          </div>

          <div className="grid grid-cols-7 flex-1">
            {renderCalendar()}
          </div>

          {selectedDate && (
            <div className="fixed inset-0 bg-black/40 flex items-end justify-center z-50 p-4">
              <div className="bg-white w-full max-w-md rounded-t-2xl p-6 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-lg">{month + 1}月{selectedDate}日のシフト登録</h3>
                  <button onClick={() => setSelectedDate(null)} className="text-slate-400 font-bold text-xl">&times;</button>
                </div>

                <div className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">区分</label>
                    <select value={shiftType} onChange={(e) => setShiftType(e.target.value)} className="w-full border rounded p-2 bg-slate-50">
                      <option value="日勤">日勤</option>
                      <option value="早番">早番</option>
                      <option value="遅番">遅番</option>
                      <option value="夜勤">夜勤</option>
                      <option value="休み">休み</option>
                    </select>
                  </div>

                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-xs font-bold text-slate-500 mb-1">開始時間</label>
                      <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full border rounded p-2 bg-slate-50" />
                    </div>
                    <div className="flex-1">
                      <label className="block text-xs font-bold text-slate-500 mb-1">終了時間</label>
                      <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full border rounded p-2 bg-slate-50" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">メモ</label>
                    <input type="text" placeholder="メモを入力" value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full border rounded p-2 bg-slate-50" />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={handleSaveShift} className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700">保存</button>
                  {shifts[`${year}-${String(month + 1).padStart(2, '0')}-${String(selectedDate).padStart(2, '0')}`] && (
                    <button onClick={() => {
                      handleDeleteShift(`${year}-${String(month + 1).padStart(2, '0')}-${String(selectedDate).padStart(2, '0')}`);
                      setSelectedDate(null);
                    }} className="bg-red-500 text-white font-bold px-4 py-3 rounded-lg shadow hover:bg-red-600">削除</button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<ShiftApp />);
  </script>
</body>
</html>
