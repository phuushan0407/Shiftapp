コードをありがとうございます！原因がはっきり特定できました。
SyntaxError: Unexpected token '{' が発生していた理由は、Babel（JSX変換用ライブラリ）のバージョン指定がなかったことと、最新ブラウザが <script type="text/babel"> 内の特定の文字（波かっこ等）をパース（解析）する際の解釈エラーです。
何が問題だったのか？
 * Babelの読み込みが最新(v7)すぎた
   <script src=".../babel.min.js"></script> とバージョン指定なしで読み込んでいたため、ブラウザ側が「import構文の処理」を期待してしまう挙動が発生していました。
 * 純粋なJavaScript（ES6/Vanilla JS）になっていなかった
   <script type="text/babel"> は開発用・試作用のもので、Safari等のスマホブラウザでは実行時エラーが非常に起きやすい仕組みになっています。
 * PWA（Webアプリ化）用メタタグが不足していた
   iPhoneのホーム画面に追加した際に全画面表示（アプリ化）する設定が含まれていませんでした。
修正済みの完全コード (index.html)
以下のコードは、Babelなどのトランスパイル処理に依存せず、100%純粋なJavaScript（React.createElement 形式）に書き換えた完全版です。
import も Babel によるエラーも一切発生せず、GitHub Pages でも iPhone の Safari / Chrome でも一発で起動します。また、ホーム画面に追加した際にアプリ化（全画面表示）されるメタタグも同梱済みです。
この下のコードを全文コピーして index.html に上書き保存し、GitHub Pages にアップロード（Push）してください！

/* ユーティリティ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function parseDateStr(s) {
  const parts = (s || '1970-01-01').split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function formatCurrency(n) {
  const v = Math.round(Number(n) || 0);
  return '¥' + v.toLocaleString('ja-JP');
}
function formatHours(h) {
  if (!isFinite(h)) return '0時間';
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  if (mm === 0) return hh + '時間';
  if (mm === 60) return (hh + 1) + '時間';
  return hh + '時間' + mm + '分';
}
function timeToMinutes(t) {
  const parts = (t || '0:0').split(':').map(Number);
  return (parts[0] || 0) * 60 + (parts[1] || 0);
}
function overlapMinutes(aS, aE, bS, bE) {
  return Math.max(0, Math.min(aE, bE) - Math.max(aS, bS));
}
function premiumHoursInRange(shiftStart, shiftEnd, premStart, premEnd) {
  let pS = premStart, pE = premEnd;
  if (pE <= pS) pE += 1440;
  let total = 0;
  for (let d = -1; d <= 1; d++) {
    total += overlapMinutes(shiftStart, shiftEnd, pS + d * 1440, pE + d * 1440);
  }
  return total / 60;
}
function getWeekdayIndex(dateStr) { return parseDateStr(dateStr).getDay(); }
function buildMonthGrid(year, month, weekStart) {
  const firstDay = new Date(year, month, 1);
  const startOffset = weekStart === 'monday' ? (firstDay.getDay() + 6) % 7 : firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

/* 正規化 */
function normalizeWorkplace(w) {
  w = w || {};
  const customSrc = Array.isArray(w.customAllowances) ? w.customAllowances : [];
  const nightSrc = Array.isArray(w.nightPremiums) ? w.nightPremiums : [];
  return {
    id: w.id || uid(),
    name: w.name || '無題の勤務先',
    color: w.color || COLORS[0],
    tags: Array.isArray(w.tags) ? w.tags.filter(Boolean) : (typeof w.tags === 'string' ? w.tags.split(',').map(s => s.trim()).filter(Boolean) : []),
    payType: w.payType === 'daily' ? 'daily' : 'hourly',
    payAmount: Number(w.payAmount) || 0,
    transportationFee: Number(w.transportationFee) || 0,
    qualificationAllowance: {
      amount: Number(w.qualificationAllowance && w.qualificationAllowance.amount) || 0,
      unit: (w.qualificationAllowance && w.qualificationAllowance.unit === 'hour') ? 'hour' : 'day'
    },
    customAllowances: [0, 1, 2].map(i => ({
      name: (customSrc[i] && customSrc[i].name) || '',
      amount: Number(customSrc[i] && customSrc[i].amount) || 0
    })),
    nightPremiums: [0, 1].map(i => ({
      start: (nightSrc[i] && nightSrc[i].start) || (i === 0 ? '22:00' : '00:00'),
      end: (nightSrc[i] && nightSrc[i].end) || (i === 0 ? '05:00' : '00:00'),
      rate: Number(nightSrc[i] && nightSrc[i].rate) || 0
    })),
    satAllowancePerHour: Number(w.satAllowancePerHour) || 0,
    sunAllowancePerHour: Number(w.sunAllowancePerHour) || 0,
    holidayAllowancePerHour: Number(w.holidayAllowancePerHour) || 0
  };
}
function normalizeShift(s) {
  s = s || {};
  const hasWorkplace = !!s.workplaceId;
  const de = s.directEntry || {};
  const today = new Date();
  return {
    id: s.id || uid(),
    date: s.date || toDateStr(today.getFullYear(), today.getMonth(), today.getDate()),
    workplaceId: hasWorkplace ? s.workplaceId : null,
    directEntry: hasWorkplace ? null : {
      name: de.name || '無題',
      payType: de.payType === 'daily' ? 'daily' : 'hourly',
      payAmount: Number(de.payAmount) || 0,
      tags: Array.isArray(de.tags) ? de.tags.filter(Boolean) : (typeof de.tags === 'string' ? de.tags.split(',').map(t => t.trim()).filter(Boolean) : [])
    },
    startTime: s.startTime || '09:00',
    endTime: s.endTime || '17:00',
    isAllDay: !!s.isAllDay,
    isHoliday: !!s.isHoliday,
    memo: s.memo || ''
  };
}
function normalizeSettings(s) {
  s = s || {};
  return { weekStart: s.weekStart === 'monday' ? 'monday' : 'sunday' };
}

/* 給料計算 */
function calcShiftDetail(shift, workplaces) {
  const wp = shift.workplaceId ? workplaces.find(w => w.id === shift.workplaceId) : null;
  const name = wp ? wp.name : ((shift.directEntry && shift.directEntry.name) || '無題');
  const color = wp ? wp.color : '#8A8A8A';
  const payType = wp ? wp.payType : ((shift.directEntry && shift.directEntry.payType) || 'hourly');
  const payAmount = wp ? wp.payAmount : ((shift.directEntry && shift.directEntry.payAmount) || 0);

  let shiftStart, shiftEnd, hours;
  if (shift.isAllDay) {
    shiftStart = 0; shiftEnd = 1440; hours = 24;
  } else {
    shiftStart = timeToMinutes(shift.startTime);
    shiftEnd = timeToMinutes(shift.endTime);
    if (shiftEnd <= shiftStart) shiftEnd += 1440;
    hours = (shiftEnd - shiftStart) / 60;
  }

  const base = payType === 'hourly' ? payAmount * hours : payAmount;
  let nightPremium = 0, dayAllowance = 0, qualificationAllowance = 0, customTotal = 0, transportationFee = 0;
  const customBreakdown = [];

  if (wp && payType === 'hourly') {
    wp.nightPremiums.forEach(p => {
      if (!p.rate) return;
      const h = premiumHoursInRange(shiftStart, shiftEnd, timeToMinutes(p.start), timeToMinutes(p.end));
      nightPremium += payAmount * (p.rate / 100) * h;
    });
  }

  if (wp) {
    const wd = getWeekdayIndex(shift.date);
    if (shift.isHoliday) {
      dayAllowance = wp.holidayAllowancePerHour * hours;
    } else if (wd === 6) {
      dayAllowance = wp.satAllowancePerHour * hours;
    } else if (wd === 0) {
      dayAllowance = wp.sunAllowancePerHour * hours;
    }

    if (wp.qualificationAllowance.amount) {
      qualificationAllowance = wp.qualificationAllowance.unit === 'hour'
        ? wp.qualificationAllowance.amount * hours
        : wp.qualificationAllowance.amount;
    }

    wp.customAllowances.forEach(a => {
      if (a.amount) { customTotal += a.amount; customBreakdown.push(a); }
    });

    transportationFee = wp.transportationFee || 0;
  }

  const total = base + nightPremium + dayAllowance + qualificationAllowance + customTotal + transportationFee;
  return {
    name, color, hours, base, nightPremium, dayAllowance, qualificationAllowance,
    customTotal, customBreakdown, transportationFee, total,
    isDirect: !wp,
    tags: wp ? wp.tags : ((shift.directEntry && shift.directEntry.tags) || [])
  };
}

/* 集計期間 */
function getPeriodRange(type, refDate, weekStart) {
  const d = new Date(refDate);
  if (type === 'day') {
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const end = new Date(start); end.setDate(end.getDate() + 1);
    return { start, end, label: start.getFullYear() + '年' + (start.getMonth() + 1) + '月' + start.getDate() + '日' };
  }
  if (type === 'week') {
    const dow = d.getDay();
    const offset = weekStart === 'monday' ? (dow + 6) % 7 : dow;
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - offset);
    const end = new Date(start); end.setDate(end.getDate() + 7);
    const endIncl = new Date(end); endIncl.setDate(endIncl.getDate() - 1);
    return { start, end, label: (start.getMonth() + 1) + '/' + start.getDate() + ' 〜 ' + (endIncl.getMonth() + 1) + '/' + endIncl.getDate() };
  }
  if (type === 'month') {
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return { start, end, label: start.getFullYear() + '年' + (start.getMonth() + 1) + '月' };
  }
  const start = new Date(d.getFullYear(), 0, 1);
  const end = new Date(d.getFullYear() + 1, 0, 1);
  return { start, end, label: start.getFullYear() + '年' };
}

function shiftInRange(dateStr, start, end) {
  const d = parseDateStr(dateStr);
  return d >= start && d < end;
}

function movePeriod(type, refDate, dir) {
  const d = new Date(refDate);
  if (type === 'day') d.setDate(d.getDate() + dir);
  else if (type === 'week') d.setDate(d.getDate() + 7 * dir);
  else if (type === 'month') d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  return d;
}

/* Hooks */
function useLocalStorageState(key, normalizeFn, isArray) {
  const [state, setState] = React.useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return isArray ? [] : normalizeFn({});
      const parsed = JSON.parse(raw);
      if (isArray) return Array.isArray(parsed) ? parsed.map(normalizeFn) : [];
      return normalizeFn(parsed || {});
    } catch (e) {
      return isArray ? [] : normalizeFn({});
    }
  });
  React.useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
  }, [state, key]);
  return [state, setState];
}

/* カレンダータブ */
function CalendarTab({ workplaces, shifts, settings, onOpenDay }) {
  const today = new Date();
  const [year, setYear] = React.useState(today.getFullYear());
  const [month, setMonth] = React.useState(today.getMonth());

  const weekStart = settings.weekStart;
  const weekdayLabels = weekStart === 'monday' ? ['月','火','水','木','金','土','日'] : ['日','月','火','水','木','金','土'];
  const grid = buildMonthGrid(year, month, weekStart);

  const shiftsByDate = React.useMemo(() => {
    const map = {};
    shifts.forEach(s => {
      if (!map[s.date]) map[s.date] = [];
      map[s.date].push(s);
    });
    Object.keys(map).forEach(date => {
      map[date].sort((a, b) => {
        if (a.isAllDay && !b.isAllDay) return -1;
        if (!a.isAllDay && b.isAllDay) return 1;
        return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
      });
    });
    return map;
  }, [shifts]);

  function prevMonth() { setMonth(m => { if (m === 0) { setYear(y => y - 1); return 11; } return m - 1; }); }
  function nextMonth() { setMonth(m => { if (m === 11) { setYear(y => y + 1); return 0; } return m + 1; }); }

  function dayStats(dateStr) {
    const list = shiftsByDate[dateStr] || [];
    let hours = 0, amount = 0;
    list.forEach(s => { const d = calcShiftDetail(s, workplaces); hours += d.hours; amount += d.total; });
    return { count: list.length, hours, amount };
  }

  function weekStats(week) {
    let hours = 0, amount = 0;
    week.forEach(d => {
      if (d == null) return;
      const st = dayStats(toDateStr(year, month, d));
      hours += st.hours; amount += st.amount;

function DaySheet({ date, workplaces, shifts, onClose, onAddShift, onEditShift, onDeleteShift }) {
  const list = shifts.filter(s => s.date === date).sort((a, b) => {
    if (a.isAllDay && !b.isAllDay) return -1;
    if (!a.isAllDay && b.isAllDay) return 1;
    return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
  });
  const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);
  const d = parseDateStr(date);
  const label = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + ['日','月','火','水','木','金','土'][d.getDay()] + '）';

        e('p', { className: "text-[10px] text-stone-400 mt-1.5" }, "シフト側の「祝日」フラグがオンの場合は祝日の加算のみが適用され、土曜・日曜の加算とは重複しません。")
      ),
      e('div', { className: "flex gap-2 pt-2" },
        !isNew && e('button', { onClick: () => setConfirmDelete(true), className: "py-2.5 px-4 rounded-lg border border-rose-300 text-rose-600 text-sm font-medium" }, "削除"),
        e('button', { disabled: !canSave, onClick: handleSave, className: "flex-1 py-2.5 rounded-lg bg-stone-800 text-white text-sm font-medium disabled:opacity-40" }, "保存する")
      )
    ),
    confirmDelete && e(ConfirmDialog, { message: "この勤務先を削除しますか？", onCancel: () => setConfirmDelete(false), onConfirm: () => { onDelete(workplace.id); setConfirmDelete(false); } })
  );
}

/* 集計タブ */
function SummaryTab({ workplaces, shifts, settings }) {
  const [periodType, setPeriodType] = React.useState('month');
  const [refDate, setRefDate] = React.useState(new Date());
  const [tagFilter, setTagFilter] = React.useState('');
  const [selectedTag, setSelectedTag] = React.useState(null);

  const range = getPeriodRange(periodType, refDate, settings.weekStart);

  const allTags = React.useMemo(() => {
    const set = new Set();
    workplaces.forEach(w => w.tags.forEach(t => set.add(t)));
    shifts.forEach(s => (s.directEntry && s.directEntry.tags || []).forEach(t => set.add(t)));
    return Array.from(set);
  }, [workplaces, shifts]);

  const filterText = tagFilter.trim().toLowerCase();

  const periodShifts = shifts
    .filter(s => shiftInRange(s.date, range.start, range.end))
    .filter(s => {
      if (!selectedTag && !filterText) return true;
      const detail = calcShiftDetail(s, workplaces);
      const tags = detail.tags.map(t => t.toLowerCase());
      if (selectedTag) return tags.includes(selectedTag.toLowerCase());
      return tags.some(t => t.includes(filterText)) || detail.name.toLowerCase().includes(filterText);
    })
    .sort((a, b) => a.date.localeCompare(b.date) || timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

  let totalAmount = 0, totalHours = 0;
  const byWorkplace = {};
  periodShifts.forEach(s => {
    const detail = calcShiftDetail(s, workplaces);
    totalAmount += detail.total;
    totalHours += detail.hours;
    const key = s.workplaceId || ('direct:' + detail.name);
    if (!byWorkplace[key]) byWorkplace[key] = { name: detail.name, color: detail.color, amount: 0, hours: 0 };
    byWorkplace[key].amount += detail.total;
    byWorkplace[key].hours += detail.hours;
  });
  const breakdown = Object.values(byWorkplace).sort((a, b) => b.amount - a.amount);

  return e('div', { className: "px-3 pt-4 pb-4" },
    e('header', { className: "mb-4 px-1" },
      e('h1', { className: "font-serif text-2xl font-semibold mb-3" }, "集計"),
      e('div', { className: "flex rounded-lg border border-stone-300 overflow-hidden text-sm mb-2" },
        [['day', '日'], ['week', '週'], ['month', '月'], ['year', '年']].map(([v, l]) =>
          e('button', { key: v, onClick: () => setPeriodType(v), className: "flex-1 py-1.5 " + (periodType === v ? 'bg-stone-800 text-white' : 'bg-white text-stone-600') }, l)
        )
      ),
      e('div', { className: "flex items-center justify-between" },
        e('button', { onClick: () => setRefDate(d => movePeriod(periodType, d, -1)), className: "p-2 rounded-full hover:bg-stone-200/60" }, e(IconChevronLeft)),
        e('span', { className: "font-mono text-sm font-medium" }, range.label),
        e('button', { onClick: () => setRefDate(d => movePeriod(periodType, d, 1)), className: "p-2 rounded-full hover:bg-stone-200/60" }, e(IconChevronRight))
      )
    ),
    e('div', { className: "mb-3" },
      e('div', { className: "relative" },
        e(IconSearch, { size: 15, className: "absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" }),
        e('input', { value: tagFilter, onChange: e => { setTagFilter(e.target.value); setSelectedTag(null); }, placeholder: "タグ・勤務先名で絞り込み", className: INPUT_CLASS + ' pl-9' })
      ),
      allTags.length > 0 && e('div', { className: "flex flex-wrap gap-1.5 mt-2" },
        allTags.map(t => e('button', {
          key: t, onClick: () => { setSelectedTag(prev => prev === t ? null : t); setTagFilter(''); },
          className: "text-xs px-2 py-1 rounded-full border " + (selectedTag === t ? 'bg-stone-800 text-white border-stone-800' : 'bg-white border-stone-300 text-stone-600')
        }, t))
      )
    ),
    e('div', { className: "bg-white rounded-lg border border-stone-200 p-4 mb-3 text-center" },
      e('div', { className: "text-3xl font-mono font-bold" }, formatCurrency(totalAmount)),
      e('div', { className: "text-sm font-mono text-stone-500 mt-1" }, formatHours(totalHours))
    ),
    e('div', { className: "bg-white rounded-lg border border-stone-200 divide-y divide-stone-100 mb-3" },
      breakdown.length === 0 && e('p', { className: "text-sm text-stone-500 text-center py-6" }, "この期間のシフトはありません"),
      breakdown.map((b, i) => e('div', { key: i, className: "flex items-center gap-2.5 px-3 py-2.5" },
        e('span', { className: "w-2.5 h-2.5 rounded-full flex-shrink-0", style: { backgroundColor: b.color } }),
        e('span', { className: "flex-1 text-sm truncate" }, b.name),
        e('span', { className: "text-xs font-mono text-stone-500" }, formatHours(b.hours)),
        e('span', { className: "text-sm font-mono font-medium w-20 text-right" }, formatCurrency(b.amount))
      ))
    ),
    e('button', { onClick: () => window.print(), className: "w-full py-2.5 rounded-lg border border-stone-300 text-sm font-medium flex items-center justify-center gap-1.5" },
      e(IconPrinter, { size: 16 }), " PDF出力（印刷）"
    ),
    e('div', { id: "print-section" },
      e('h1', null, "シフト台帳 集計 - " + range.label),
      e('p', null, "合計金額：" + formatCurrency(totalAmount) + " ／ 合計時間：" + formatHours(totalHours)),
      e('h2', null, "勤務先別内訳"),
      e('table', null,
        e('thead', null, e('tr', null, e('th', null, "勤務先"), e('th', null, "時間"), e('th', null, "金額"))),
        e('tbody', null, breakdown.map((b, i) => e('tr', { key: i }, e('td', null, b.name), e('td', null, formatHours(b.hours)), e('td', null, formatCurrency(b.amount)))))
      ),
      e('h2', null, "シフト明細"),
      e('table', null,
        e('thead', null, e('tr', null, e('th', null, "日付"), e('th', null, "勤務先"), e('th', null, "時間帯"), e('th', null, "時間数"), e('th', null, "金額"))),
        e('tbody', null, periodShifts.map(s => {
          const d = calcShiftDetail(s, workplaces);
          return e('tr', { key: s.id },
            e('td', null, s.date), e('td', null, d.name),
            e('td', null, s.isAllDay ? '終日' : (s.startTime + '-' + s.endTime)),
            e('td', null, formatHours(d.hours)), e('td', null, formatCurrency(d.total))
          );
        }))
      )
    )
  );
}

/* 設定タブ */
function SettingsTab({ settings, setSettings, workplaces, shifts, setWorkplaces, setShifts }) {
  const fileInputRef = React.useRef(null);
  const [confirmRestore, setConfirmRestore] = React.useState(null);

  function handleExport() {
    const data = { workplaces, shifts, settings, exportedAt: new Date().toISOString(), version: APP_VERSION };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const today = new Date();
    a.download = 'shift-ledger-backup-' + toDateStr(today.getFullYear(), today.getMonth(), today.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function handleFileChosen(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        setConfirmRestore(parsed);
      } catch (err) {
        alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  function doRestore() {
    const parsed = confirmRestore || {};
    setWorkplaces(Array.isArray(parsed.workplaces) ? parsed.workplaces.map(normalizeWorkplace) : []);
    setShifts(Array.isArray(parsed.shifts) ? parsed.shifts.map(normalizeShift) : []);
    setSettings(normalizeSettings(parsed.settings || {}));
    setConfirmRestore(null);
  }

  return e('div', { className: "px-3 pt-4 pb-4" },
    e('h1', { className: "font-serif text-2xl font-semibold mb-4 px-1" }, "設定"),
    e('section', { className: "bg-white rounded-lg border border-stone-200 p-4 mb-3" },
      e('span', { className: "block text-xs font-semibold text-stone-500 mb-2" }, "週の開始日"),
      e('div', { className: "flex rounded-lg border border-stone-300 overflow-hidden text-sm" },
        e('button', { onClick: () => setSettings({ ...settings, weekStart: 'sunday' }), className: "flex-1 py-2 " + (settings.weekStart === 'sunday' ? 'bg-stone-800 text-white' : 'bg-white text-stone-600') }, "日曜始まり"),
        e('button', { onClick: () => setSettings({ ...settings, weekStart: 'monday' }), className: "flex-1 py-2 " + (settings.weekStart === 'monday' ? 'bg-stone-800 text-white' : 'bg-white text-stone-600') }, "月曜始まり")
      )
    ),
    e('section', { className: "bg-white rounded-lg border border-stone-200 p-4 mb-3 space-y-2" },
      e('span', { className: "block text-xs font-semibold text-stone-500 mb-1" }, "データのバックアップ"),
      e('button', { onClick: handleExport, className: "w-full py-2.5 rounded-lg border border-stone-300 text-sm font-medium flex items-center justify-center gap-1.5" },
        e(IconDownload, { size: 16 }), " データを書き出す（バックアップ）"
      ),
      e('button', { onClick: () => fileInputRef.current && fileInputRef.current.click(), className: "w-full py-2.5 rounded-lg border border-stone-300 text-sm font-medium flex items-center justify-center gap-1.5" },
        e(IconUpload, { size: 16 }), " データを読み込む（復元）"
      ),
      e('input', { ref: fileInputRef, type: "file", accept: "application/json", className: "hidden", onChange: handleFileChosen })
    ),
    e('section', { className: "bg-white rounded-lg border border-stone-200 p-4 mb-3" },
      e('span', { className: "block text-xs font-semibold text-stone-500 mb-2" }, "保存件数"),
      e('p', { className: "text-sm font-mono" }, "勤務先 " + workplaces.length + "件 ・ シフト " + shifts.length + "件")
    ),
    e('div', { className: "text-center text-xs text-stone-400 mt-6 space-y-0.5" },
      e('p', { className: "font-mono" }, "バージョン " + APP_VERSION),
      e('p', null, "製作者：のぶしゃん")
    ),
    confirmRestore && e(ConfirmDialog, {
      message: "現在のデータは上書きされます。よろしいですか？",
      confirmLabel: "復元する",
      onCancel: () => setConfirmRestore(null),
      onConfirm: doRestore
    })
  );
}

/* 下部ナビ */
function BottomNav({ tab, setTab }) {
  const items = [
    { id: 'calendar', label: 'カレンダー', Icon: IconCalendar },
    { id: 'workplaces', label: '勤務先', Icon: IconBriefcase },
    { id: 'summary', label: '集計', Icon: IconBarChart },
    { id: 'settings', label: '設定', Icon: IconSettings }
  ];
  return e('nav', { className: "fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 flex z-30" },
    items.map(it => e('button', {
      key: it.id, onClick: () => setTab(it.id),
      className: "flex-1 flex flex-col items-center gap-0.5 py-2.5 " + (tab === it.id ? 'text-stone-800' : 'text-stone-400')
    },
      e(it.Icon, { size: 20 }),
      e('span', { className: "text-[10px] font-medium" }, it.label)
    ))
  );
}

/* ルートアプリ */
function App() {
  const [workplaces, setWorkplaces] = useLocalStorageState('workplaces', normalizeWorkplace, true);
  const [shifts, setShifts] = useLocalStorageState('shifts', normalizeShift, true);
  const [settings, setSettings] = useLocalStorageState('settings', normalizeSettings, false);
  const [tab, setTab] = React.useState('calendar');

  const [daySheetDate, setDaySheetDate] = React.useState(null);
  const [shiftEditor, setShiftEditor] = React.useState(null);
  const [workplaceEditor, setWorkplaceEditor] = React.useState(null);

  function openDay(date) { setDaySheetDate(date); }
  function closeDay() { setDaySheetDate(null); }

  function openNewShift() { setShiftEditor({ date: daySheetDate, shift: null }); }
  function openEditShift(shiftId) {
    const s = shifts.find(x => x.id === shiftId);
    if (s) setShiftEditor({ date: s.date, shift: s });
  }
  function closeShiftEditor() { setShiftEditor(null); }
  function saveShift(shift) {
    setShifts(prev => prev.some(s => s.id === shift.id) ? prev.map(s => s.id === shift.id ? shift : s) : [...prev, shift]);
    setShiftEditor(null);
  }
  function deleteShift(id) {
    setShifts(prev => prev.filter(s => s.id !== id));
    setShiftEditor(null);
  }

  function openNewWorkplace() { setWorkplaceEditor({ isNew: true, workplace: null }); }
  function openEditWorkplace(id) { setWorkplaceEditor({ isNew: false, workplace: workplaces.find(w => w.id === id) }); }
  function closeWorkplaceEditor() { setWorkplaceEditor(null); }
  function saveWorkplace(w) {
    setWorkplaces(prev => prev.some(x => x.id === w.id) ? prev.map(x => x.id === w.id ? w : x) : [...prev, w]);
    setWorkplaceEditor(null);
  }
  function deleteWorkplace(id) {
    setWorkplaces(prev => prev.filter(w => w.id !== id));
    setWorkplaceEditor(null);
  }

  return e('div', { className: "min-h-screen bg-paper pb-20" },
    tab === 'calendar' && e(CalendarTab, { workplaces, shifts, settings, onOpenDay: openDay }),
    tab === 'workplaces' && e(WorkplacesTab, { workplaces, onAdd: openNewWorkplace, onEdit: openEditWorkplace, onDelete: deleteWorkplace }),
    tab === 'summary' && e(SummaryTab, { workplaces, shifts, settings }),
    tab === 'settings' && e(SettingsTab, { settings, setSettings, workplaces, shifts, setWorkplaces, setShifts }),

    e(BottomNav, { tab, setTab }),

    daySheetDate && e(DaySheet, {
      date: daySheetDate, workplaces, shifts,
      onClose: closeDay, onAddShift: openNewShift, onEditShift: openEditShift, onDeleteShift: deleteShift
    }),

    shiftEditor && e(ShiftEditorSheet, {
      date: shiftEditor.date, shift: shiftEditor.shift, workplaces,
      onClose: closeShiftEditor, onSave: saveShift, onDelete: deleteShift
    }),

    workplaceEditor && e(WorkplaceEditorSheet, {
      workplace: workplaceEditor.workplace,
      onClose: closeWorkplaceEditor, onSave: saveWorkplace, onDelete: deleteWorkplace
    })
  );
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(e(App));
const loadingEl = document.getElementById('loading-screen');
if (loadingEl) loadingEl.style.display = 'none';

</script>
</body>
