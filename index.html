<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト管理台帳</title>
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (ブラウザ内でJSXを変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- アイコンコンポーネント（import不要の直書きSVG） ---
    const IconUserCheck = () => (
      <svg class="w-7 h-7 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
    );
    const IconClock = () => (
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const IconDollar = () => (
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    );
    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg class={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const IconTrash = () => (
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    );
    const IconCalendar = () => (
      <svg class="w-4 h-4 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );

    // --- メインアプリ ---
    function ShiftLedger() {
      const [shifts, setShifts] = useState([
        { id: 1, date: '2026-08-12', startTime: '09:00', endTime: '17:00', hourlyRate: 1200, note: '日勤（食事介助・入浴補助）' },
        { id: 2, date: '2026-08-13', startTime: '13:00', endTime: '21:00', hourlyRate: 1200, note: '遅番' }
      ]);

      const [date, setDate] = useState('');
      const [startTime, setStartTime] = useState('');
      const [endTime, setEndTime] = useState('');
      const [hourlyRate, setHourlyRate] = useState('1200');
      const [note, setNote] = useState('');

      const calculateHours = (start, end) => {
        if (!start || !end) return 0;
        const [sH, sM] = start.split(':').map(Number);
        const [eH, eM] = end.split(':').map(Number);
        const diff = (eH * 60 + eM - (sH * 60 + sM)) / 60;
        return diff > 0 ? diff : 0;
      };

      const handleAddShift = (e) => {
        e.preventDefault();
        if (!date || !startTime || !endTime) return;

        const newShift = {
          id: Date.now(),
          date,
          startTime,
          endTime,
          hourlyRate: Number(hourlyRate) || 0,
          note
        };

        setShifts([...shifts, newShift]);
        setDate('');
        setStartTime('');
        setEndTime('');
        setNote('');
      };

      const handleDelete = (id) => {
        setShifts(shifts.filter(s => s.id !== id));
      };

      const totalHours = shifts.reduce((acc, s) => acc + calculateHours(s.startTime, s.endTime), 0);
      const totalPay = shifts.reduce((acc, s) => acc + (calculateHours(s.startTime, s.endTime) * s.hourlyRate), 0);

      return (
        <div class="max-w-4xl mx-auto p-4 md:p-6 min-h-screen">
          {/* ヘッダー */}
          <header class="mb-6 pb-4 border-b border-stone-200 flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-stone-900 flex items-center gap-2">
                <IconUserCheck />
                シフト管理台帳
              </h1>
              <p class="text-xs text-stone-400 mt-1">勤務シフトの記録および概算見込給与の算定システム</p>
            </div>
          </header>

          {/* 集計サマリー */}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
              <div>
                <p class="text-xs text-stone-500 font-medium">合計勤務時間</p>
                <p class="text-2xl font-bold text-stone-900 mt-1">{totalHours.toFixed(1)} <span class="text-sm font-normal text-stone-500">時間</span></p>
              </div>
              <div class="p-3 bg-indigo-50 rounded-lg text-indigo-600">
                <IconClock />
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
              <div>
                <p class="text-xs text-stone-500 font-medium">概算見込給与</p>
                <p class="text-2xl font-bold text-emerald-600 mt-1">¥{totalPay.toLocaleString()}</p>
              </div>
              <div class="p-3 bg-emerald-50 rounded-lg text-emerald-600">
                <IconDollar />
              </div>
            </div>
          </div>

          {/* シフト登録フォーム */}
          <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200 mb-6">
            <h2 class="text-base font-semibold text-stone-800 mb-4 flex items-center gap-2">
              <IconPlus class="w-4 h-4 text-indigo-600" /> シフト追加
            </h2>
            <form onSubmit={handleAddShift} class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs text-stone-600 mb-1">日付</label>
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-stone-600 mb-1">開始時間</label>
                <input
                  type="time"
                  value={startTime}
                  onChange={(e) => setStartTime(e.target.value)}
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-stone-600 mb-1">終了時間</label>
                <input
                  type="time"
                  value={endTime}
                  onChange={(e) => setEndTime(e.target.value)}
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-stone-600 mb-1">時給 (円)</label>
                <input
                  type="number"
                  value={hourlyRate}
                  onChange={(e) => setHourlyRate(e.target.value)}
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs text-stone-600 mb-1">メモ・業務内容</label>
                <input
                  type="text"
                  placeholder="例: 早番 / 入浴介助担当"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
              <div class="md:col-span-3 flex justify-end">
                <button
                  type="submit"
                  class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm"
                >
                  <IconPlus class="w-4 h-4 text-white" /> 登録する
                </button>
              </div>
            </form>
          </div>

          {/* シフト一覧テーブル */}
          <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
            <div class="px-5 py-4 border-b border-stone-100">
              <h2 class="text-base font-semibold text-stone-800 flex items-center gap-2">
                <IconCalendar /> シフト一覧
              </h2>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-stone-50 text-stone-500 font-medium border-b border-stone-200">
                  <tr>
                    <th class="px-5 py-3">日付</th>
                    <th class="px-5 py-3">時間</th>
                    <th class="px-5 py-3">勤務時間</th>
                    <th class="px-5 py-3">時給</th>
                    <th class="px-5 py-3">見込給与</th>
                    <th class="px-5 py-3">メモ</th>
                    <th class="px-5 py-3 text-right">操作</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-stone-100">
                  {shifts.length === 0 ? (
                    <tr>
                      <td colSpan="7" class="text-center py-8 text-stone-400">
                        登録されているシフトはありません。
                      </td>
                    </tr>
                  ) : (
                    shifts.map((s) => {
                      const hrs = calculateHours(s.startTime, s.endTime);
                      const pay = hrs * s.hourlyRate;
                      return (
                        <tr key={s.id} class="hover:bg-stone-50/80 transition">
                          <td class="px-5 py-3 font-medium text-stone-900">{s.date}</td>
                          <td class="px-5 py-3 text-stone-600">{s.startTime} - {s.endTime}</td>
                          <td class="px-5 py-3 text-stone-600">{hrs.toFixed(1)} 時間</td>
                          <td class="px-5 py-3 text-stone-600">¥{s.hourlyRate.toLocaleString()}</td>
                          <td class="px-5 py-3 font-medium text-emerald-600">¥{pay.toLocaleString()}</td>
                          <td class="px-5 py-3 text-stone-500 text-xs">{s.note || '-'}</td>
                          <td class="px-5 py-3 text-right">
                            <button
                              onClick={() => handleDelete(s.id)}
                              class="text-stone-400 hover:text-red-500 transition p-1"
                              title="削除"
                            >
                              <IconTrash />
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
            <div class="p-4 border-t border-stone-100 bg-stone-50 text-right">
              <p class="text-xs text-stone-400">
                ※概算給与は休憩時間を含まない単純計算値です。
              </p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ShiftLedger />);
  </script>
</body>
</html>
